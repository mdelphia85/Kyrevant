services:
  - type: web
    name: kyrevant-multiplayer
    runtime: node
    rootDir: contest-web
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
